<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — SCOTS</title>
  <link rel="icon" type="image/png" href="assets/icons/scots-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260825-9">
  <link rel="stylesheet" href="css/responsive.css?v=20260825-9">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="success-wrap">
      <div class="success-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <span class="eyebrow" style="justify-content:center">Order Confirmed</span>
      <h1 style="margin-top:8px">Your food is on the fire 🔥</h1>
      <p class="text-muted mt-16">Show this token at the counter when your number is called.</p>

      <div class="token-hero">
        <div class="tk-label" id="tk-full">SCOTS-000</div>
        <div class="tk-num" id="tk-num">#000</div>
      </div>

      <div class="detail-grid">
        <div class="detail-cell"><small>Estimated Pickup</small><strong id="success-eta">—</strong></div>
        <div class="detail-cell"><small>Wait Time</small><strong id="success-wait">—</strong></div>
        <div class="detail-cell"><small>Payment</small><strong id="success-pay">—</strong></div>
        <div class="detail-cell"><small>Pickup Slot</small><strong id="success-slot">—</strong></div>
      </div>

      <div class="panel mt-24" style="text-align:left">
        <div class="flex-between mb-16">
          <h3 style="margin:0">Items</h3>
          <span id="success-status"></span>
        </div>
        <div id="success-items"></div>
        <div class="mt-16" id="success-countdown"></div>
      </div>

      <div class="mt-24" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="orders.html">Track in My Orders</a>
        <a class="btn btn-outline" href="token-display.html">Watch Token Display</a>
        <a class="btn btn-ghost" href="menu.html">Order More</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/app.js?v=20260825-8"></script>
  <script src="js/notifications.js?v=20260825-2"></script>
  <script src="js/realtime.js?v=20260825-1"></script>
  <script>initPage("orders");</script>
  <script src="js/orders.js"></script>
</body>
</html>
