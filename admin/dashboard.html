<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SCOTS</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=20260825-9">
  <link rel="stylesheet" href="../css/responsive.css?v=20260825-9">
</head>
<body data-root="../">
  <div id="navbar"></div>
  <div id="ops-nav"></div>

  <main class="container">
    <div class="page-head page-head-row">
      <div class="page-head-main">
        <span class="eyebrow">Canteen Admin Console</span>
        <h1>Canteen overview</h1>
        <p>Live picture of today's service — orders, revenue, popular items and the audit trail.</p>
      </div>
      <div class="page-queue-card" aria-live="polite" aria-label="Live kitchen queue wait time">
        <span class="page-queue-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg></span>
        <span class="page-queue-copy"><strong>Live Queue</strong><small>Kitchen wait time</small></span>
        <strong class="page-queue-value" data-live-queue-wait>—</strong>
      </div>
    </div>

    <div class="stat-grid" id="admin-stats"></div>

    <div class="chart-grid mb-24">
      <div class="chart-card">
        <h3>Most ordered items</h3>
        <div id="admin-popular"></div>
      </div>
      <div class="chart-card">
        <h3>Order status distribution</h3>
        <div id="admin-status-dist"></div>
      </div>
    </div>

    <div class="chart-card mb-24">
      <h3>Audit log</h3>
      <div id="admin-audit"></div>
    </div>

    <div id="demo-controls" class="mb-24"></div>
  </main>

  <div id="footer"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/slots.js"></script>
  <script src="../js/queue.js"></script>
  <script src="../js/app.js?v=20260825-8"></script>
  <script src="../js/notifications.js?v=20260825-4"></script>
  <script src="../js/realtime.js?v=20260825-4"></script>
  <script src="../js/admin.js"></script>
  <script>initPage("dash"); Admin.initDashboard();</script>
</body>
</html>
