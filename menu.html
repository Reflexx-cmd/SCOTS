<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — SCOTS</title>
  <link rel="icon" type="image/png" href="assets/icons/scots-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260825-9">
  <link rel="stylesheet" href="css/responsive.css?v=20260825-9">
</head>
<body>
  <div id="navbar"></div>

  <main id="menu-main">
    <div class="container page-head page-head-row">
      <div class="page-head-main">
        <span class="eyebrow">Today's Kitchen</span>
        <h1>What's cooking today?</h1>
        <p>Fresh items with live availability, honest prep times and a slot for every order.</p>
      </div>
      <div class="page-queue-card" aria-live="polite" aria-label="Live kitchen queue wait time">
        <span class="page-queue-icon" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg></span>
        <span class="page-queue-copy"><strong>Live Queue</strong><small>Kitchen wait time</small></span>
        <strong class="page-queue-value" data-live-queue-wait>—</strong>
      </div>
    </div>

    <div class="container">
      <div id="hours-notice"></div>
      <div id="account-notice"></div>

      <div class="menu-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="menu-search" type="search" placeholder="Search dosa, chai, fries…" aria-label="Search the menu">
        </div>
        <div class="chip-row" id="category-chips" role="tablist" aria-label="Menu categories"></div>
      </div>

      <div class="food-grid" id="menu-grid" aria-live="polite"></div>
    </div>

    <section class="section section-cream mt-32">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Loved on Campus</span>
          <h2>Popular picks</h2>
        </div>
        <div class="food-grid" id="popular-rail"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/app.js?v=20260825-8"></script>
  <script src="js/notifications.js?v=20260825-2"></script>
  <script src="js/realtime.js?v=20260825-1"></script>
  <script>initPage("menu");</script>
  <script src="js/menu.js"></script>
</body>
</html>
