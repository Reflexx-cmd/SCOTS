<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — SCOTS</title>
  <link rel="icon" type="image/png" href="assets/icons/scots-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260825-9">
  <link rel="stylesheet" href="css/responsive.css?v=20260825-9">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="page-head page-head-row">
      <div class="page-head-main">
        <span class="eyebrow">Order History</span>
        <h1>My orders</h1>
        <p>Live status, locked ETAs and collect-by countdowns. Click any order for full details.</p>
      </div>
      <div class="page-queue-card" aria-live="polite" aria-label="Live kitchen queue wait time">
        <span class="page-queue-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg></span>
        <span class="page-queue-copy"><strong>Live Queue</strong><small>Kitchen wait time</small></span>
        <strong class="page-queue-value" data-live-queue-wait>—</strong>
      </div>
    </div>

    <div id="orders-list" style="display:grid;gap:14px" class="mb-24"></div>
  </main>

  <div id="footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/app.js?v=20260825-8"></script>
  <script src="js/notifications.js?v=20260825-4"></script>
  <script src="js/realtime.js?v=20260825-4"></script>
  <script>initPage("orders");</script>
  <script src="js/orders.js"></script>
</body>
</html>
